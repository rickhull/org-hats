# GitHub Actions. This repository on GitHub is a push mirror of Codeberg, and
# sync-on-commit is on, so CI trails a Codeberg push by the mirror sync —
# minutes. Same job as `bin/check`, plus the guard that matters for a consumer:
#   - a version tag must match package.json (bin/check-version)
#   - build dist/ from src/, and fail if the committed dist/ is stale
#   - run the neutrality fence and the examples
#
# Because CI lives on the mirror, a broken mirror stops CI too — watch the sync.
name: check

on:
  push:
  # Codeberg pull requests surface here as branch pushes; no separate event.
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Release metadata (a version tag matches package.json)
        run: bin/check-version

      - name: Install pnpm
        run: npm install --global pnpm@11

      - name: Install dev dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: dist/ is committed and in sync with src/
        run: |
          if [ -n "$(git status --porcelain -- dist)" ]; then
            echo "::error::dist/ is stale — run 'pnpm build' and commit it"
            git --no-pager diff -- dist
            exit 1
          fi

      - name: Check (fence + examples)
        run: bin/check
