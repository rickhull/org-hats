# GitHub Actions. This repository on GitHub is a release mirror: `bin/release
# --push` updates it, so CI runs when a release is pushed, not on every
# Codeberg push. The jobs delegate the portable and Cloudflare gates to
# ci/run; a cloudflare-v* tag also passes the deployable-artifact gate.
#
# Codeberg CI (.forgejo/workflows/check.yml) is the per-push gate; this is the
# release-time backstop, and the only ring where the workerd suites run in CI.
name: check

on:
  push:
  # Codeberg pull requests surface here as branch pushes; no separate event.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Pinned, not `ubuntu-latest`: this workflow runs only when a release is
    # pushed, so a runner-image migration must not land under a release.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Portable CI contract
        run: CI=1 ci/run portable

  # The Cloudflare reference runtime is a separate 0.x package. Its tests run
  # in the real workerd runtime; the portable `check` job never invokes it.
  cloudflare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Cloudflare CI contract
        run: CI=1 ci/run cloudflare

      # actions/checkout force-writes the peeled commit into refs/tags/<tag>
      # (`fetch --no-tags origin +<sha>:refs/tags/<tag>`), leaving a lightweight
      # ref where the annotated object was. The gate reads the tag object and
      # never touches the network, so the ref is restored here instead.
      - name: Restore the annotated tag object
        if: startsWith(github.ref, 'refs/tags/cloudflare-v')
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          git fetch --force origin "refs/tags/${tag}:refs/tags/${tag}"
          test "$(git cat-file -t "${tag}")" = tag

      - name: Cloudflare artifact gate
        if: startsWith(github.ref, 'refs/tags/cloudflare-v')
        run: bin/check-artifact "${GITHUB_REF#refs/tags/}"
