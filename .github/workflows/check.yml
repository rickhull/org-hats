# GitHub Actions. This repository on GitHub is a release mirror: `bin/release
# --push` updates it, so CI runs when a release is pushed, not on every
# Codeberg push. The jobs run the same gates as the local pre-push hook:
#   - a release tag must match its manifest (bin/check-version)
#   - build dist/ from src/, and fail if the committed dist/ is stale
#   - run the neutrality fence, the suites, and the example (bin/check)
#   - run the Cloudflare workerd suites in a separate job
#   - a cloudflare-v* tag also passes the deployable-artifact gate
#
# Codeberg CI (.forgejo/workflows/check.yml) is the per-push gate; this is the
# release-time backstop, and the only ring where the workerd suites run in CI.
name: check

on:
  push:
  # Codeberg pull requests surface here as branch pushes; no separate event.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Pinned, not `ubuntu-latest`: this workflow runs only when a release is
    # pushed, so a runner-image migration must not land under a release.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Release metadata (a release tag matches its manifest)
        run: bin/check-version

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile --filter org-hats

      - name: dist/ is committed and in sync with src/
        run: bin/check-dist

      - name: Check (fence, suites, example)
        run: bin/check

  # The Cloudflare reference runtime is a separate 0.x package. Its tests run
  # in the real workerd runtime; the portable `check` job never invokes it.
  cloudflare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      # The package consumes org-hats through the workspace exports, which
      # point at dist/. Build it here rather than testing whatever was
      # committed in a different job's checkout.
      - name: Build dist/
        run: bin/check-dist

      - name: Typecheck and workerd integration tests
        run: pnpm check:cloudflare

      # actions/checkout force-writes the peeled commit into refs/tags/<tag>
      # (`fetch --no-tags origin +<sha>:refs/tags/<tag>`), leaving a lightweight
      # ref where the annotated object was. The gate reads the tag object and
      # never touches the network, so the ref is restored here instead.
      - name: Restore the annotated tag object
        if: startsWith(github.ref, 'refs/tags/cloudflare-v')
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          git fetch --force origin "refs/tags/${tag}:refs/tags/${tag}"
          test "$(git cat-file -t "${tag}")" = tag

      - name: Cloudflare artifact gate
        if: startsWith(github.ref, 'refs/tags/cloudflare-v')
        run: bin/check-artifact "${GITHUB_REF#refs/tags/}"
