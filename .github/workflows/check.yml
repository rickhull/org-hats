# GitHub Actions. This repository on GitHub is a push mirror of Codeberg, and
# sync-on-commit is on, so CI trails a Codeberg push by the mirror sync —
# minutes. The jobs run the same gates as the local pre-push hook:
#   - a release tag must match its manifest (bin/check-version)
#   - build dist/ from src/, and fail if the committed dist/ is stale
#   - run the neutrality fence, the suites, and the example (bin/check)
#   - run the Cloudflare workerd suites in a separate job
#
# Because CI lives on the mirror, a broken mirror stops CI too — watch the sync.
name: check

on:
  push:
  # Codeberg pull requests surface here as branch pushes; no separate event.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Release metadata (a release tag matches its manifest)
        run: bin/check-version

      - name: Install dev dependencies
        run: pnpm install --frozen-lockfile

      - name: dist/ is committed and in sync with src/
        run: bin/check-dist

      - name: Check (fence, suites, example)
        run: bin/check

  # The Cloudflare reference runtime is a separate 0.x package. Its tests run
  # in the real workerd runtime; the portable `check` job never invokes it.
  cloudflare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      # The package consumes org-hats through the workspace exports, which
      # point at dist/. Build it here rather than testing whatever was
      # committed in a different job's checkout.
      - name: Build dist/
        run: bin/check-dist

      - name: Typecheck and workerd integration tests
        run: pnpm check:cloudflare
