# Codeberg's hosted Forgejo Actions: the portable gate only.
#
# `codeberg-small` is 2 CPU / 4 GB / 5 min. The root-only install keeps the
# Cloudflare workspace (workerd, vitest, wrangler) off this runner; workerd
# stays on the local/release rings. A local root-only run is well inside the
# cap: install ~5s (warm store), build ~4s, check ~5s. The first hosted run
# was green in ~1m25s, well inside the 5-minute cap.
name: check

on:
  push:
  workflow_dispatch:

jobs:
  check:
    runs-on: codeberg-small
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: https://code.forgejo.org/pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: Install Node
        uses: https://code.forgejo.org/actions/setup-node@v4
        with:
          node-version: 24

      - name: Portable CI contract
        run: CI=1 ci/run portable

      # The checkout action force-writes the peeled commit into
      # refs/tags/<tag>, leaving a lightweight ref where the annotated object
      # was. The gate reads the tag object and never touches the network, so
      # the ref is restored here instead.
      - name: Restore the annotated tag object
        if: startsWith(github.ref, 'refs/tags/cloudflare-v')
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          git fetch --force origin "refs/tags/${tag}:refs/tags/${tag}"
          test "$(git cat-file -t "${tag}")" = tag

      - name: Cloudflare artifact gate
        if: startsWith(github.ref, 'refs/tags/cloudflare-v')
        run: bin/check-artifact "${GITHUB_REF#refs/tags/}" --no-build
