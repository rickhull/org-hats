# Forgejo Actions (Codeberg). Runs on every push and pull request:
#   - builds dist/ from src/ and fails if the committed dist/ is stale
#   - runs the neutrality fence and the examples (bin/check)
#
# The dist-freshness guard is the one that matters for a consumer: a change to
# src/ that is not followed by `pnpm build` would ship a dist/ that contradicts
# the source, and whoever installs a tag gets the stale build.
#
# `actions/checkout` resolves from GitHub through Codeberg's action proxy; if
# that is ever unavailable, the Forgejo-native mirror is
# https://code.forgejo.org/actions/checkout
name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: docker
    container:
      # the non-slim image includes git, which the dist-freshness check needs
      image: node:24-bookworm
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        run: npm install --global pnpm@11

      - name: Install dev dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: dist/ is committed and in sync with src/
        run: |
          if [ -n "$(git status --porcelain -- dist)" ]; then
            echo "::error::dist/ is stale — run 'pnpm build' and commit it"
            git --no-pager diff -- dist
            exit 1
          fi

      - name: Check (fence + examples)
        run: bin/check
