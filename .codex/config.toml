# Codex CLI git policy gate — repo-local config.
#
# Mirrors .claude/settings.json (Claude Code) and .pi/extensions/git-guard.ts
# (pi): a PreToolUse hook denies the git operations that AGENTS.md reserves
# for Rick (commit, push, and history-changing commands) with a reason the
# model sees, and allows `git tag` outright.
#
# The hook states the allowance rather than staying silent about it. Silence
# leaves the decision to Codex's own approval setting, which is not the same
# as allowed, and that gap is how the three harnesses drifted apart on
# tagging. Deny still wins over an allowance sharing a command line, which is
# why the parser scans every segment: `git tag v1 && git push` is a push.
#
# The "ask" tier for git add/rm/mv/restore is deliberately left to Codex's
# native approval flow: Codex PreToolUse hooks cannot return an "ask"
# decision, only deny-with-reason or allow-with-edited-input. Note the
# consequence: under Codex, that whole tier is only as gated as Codex's own
# approval setting, not by this hook. AGENTS.md records that the tier is
# interim and the prompt is scheduled to go away.
#
# Keep the deny and allow lists in lockstep with AGENTS.md ("Git policy") and
# .claude/settings.json (permissions); tests/git-guards.test.ts enforces it.
# Last aligned 2026-11-10.
#
# This is a project-local layer: Codex loads it only for this trusted
# repository, so it cannot affect work in another checkout. The hook command
# resolves from the Git root because Codex may be started in a subdirectory.

# One matcher group per hook event. PreToolUse fires before each tool call;
# the hook script inspects the input and denies only real git mutations.
[[hooks.PreToolUse]]
# Codex uses `Bash` for shell and unified-exec commands.
matcher = "^Bash$"

[[hooks.PreToolUse.hooks]]
type = "command"
command = '"$(git rev-parse --show-toplevel)/.codex/git-guard.sh"'
timeout = 5
statusMessage = "Checking repository Git policy"
